name: Graph Sync Cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -sf -X POST "https://ai-workspace-assistant-api.onrender.com/api/sync/run" \
            -H "X-Sync-Secret: ${{ secrets.SYNC_SECRET }}"
