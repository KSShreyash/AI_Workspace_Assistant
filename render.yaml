services:
  - type: web
    name: ai-workspace-assistant-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      # /common accepts both personal (outlook.com, hotmail) and work/school accounts
      - key: MS_AUTHORITY
        value: https://login.microsoftonline.com/common
      # Google OAuth, for Gmail and Google Calendar. Optional: both default to
      # empty so a Microsoft-only deployment still boots. Leave them unset and
      # every Google mailbox fails to refresh and is marked needs_reauth.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # No space after the comma - Starlette compares origins literally, and a
      # leading space would silently never match.
      - key: CORS_ALLOW_ORIGINS
        value: https://ai-workspace-assistant.pages.dev,http://localhost:3000
      # Required by Settings with no default - the service cannot boot without
      # these two. Must match the SYNC_SECRET GitHub Actions secret used by
      # .github/workflows/graph-sync-cron.yml.
      - key: SYNC_SECRET
        sync: false
      # LLM provider. Any OpenAI-compatible endpoint; Groq by default because
      # its response_format shape matches the schema this app already sends.
      # Changing provider or model is an env change, not a code change.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      # Optional (defaults to 50). Caps items processed per extraction run.
      - key: EXTRACTION_BATCH_LIMIT
        value: "50"
